# Deploy of the Firebase security rules and indexes (Firestore rules,
# Firestore indexes, Storage rules), without a local machine.
#
# - Preview: runs on its own when a push to develop changes one of these
#   files (or this workflow), so planerz-preview always matches develop.
# - Prod: started by hand from main ("Run workflow"), after a release.
#
# The target project follows the branch the workflow runs on (see RELEASE.md):
#   develop -> planerz-preview, main -> planerz.
# Authenticates with the same service account keys as the functions deploy:
#   GCP_SA_KEY_PREVIEW (planerz-preview) and GCP_SA_KEY_PROD (planerz).
name: Deploy Firebase rules

on:
  push:
    branches: [develop]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - storage.rules
      - .github/workflows/deploy-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-rules-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve target
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $project = switch ($env:REF_NAME) {
            'develop' { 'planerz-preview' }
            'main' { 'planerz' }
            default { '' }
          }
          if (-not $project) {
            Write-Error "Deploys run from develop (preview) or main (prod) only, not '$env:REF_NAME'."
            exit 1
          }
          "project=$project" >> $env:GITHUB_OUTPUT
          Write-Host "Deploying rules and indexes to $project"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ github.ref_name == 'main' && secrets.GCP_SA_KEY_PROD || secrets.GCP_SA_KEY_PREVIEW }}

      - name: Deploy
        env:
          PROJECT: ${{ steps.target.outputs.project }}
        run: |
          npx --yes firebase-tools@14 deploy --only firestore:rules,firestore:indexes,storage --project $env:PROJECT --non-interactive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "### Rules and indexes deployed to $env:PROJECT ($env:GITHUB_SHA)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
